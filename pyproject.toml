[project]
name = "avguard"
version = "0.2.0"
description = "Claim check for language-model statements on public NTSB narratives"
requires-python = ">=3.10"
dependencies = ["numpy", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
data = ["access-parser"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"src/avguard/render.py" = ["E501"]
